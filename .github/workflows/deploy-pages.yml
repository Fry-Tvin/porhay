name: Deploy to GitHub Pages

# Собирает сайт из porhai-new/ (там лежит рабочая вёрстка, см. CLAUDE.md)
# и публикует на GitHub Pages. porhai-eds/ (эталон с Тильды), spec/,
# content/ и *.py-скрипты не публикуются — это только для разработки.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site
        run: |
          mkdir -p _site
          cp porhai-new/*.html _site/
          cp -r porhai-new/assets _site/assets
          cp CNAME _site/CNAME

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
