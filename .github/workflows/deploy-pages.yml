name: Deploy to GitHub Pages

# РЎРѕР±РёСЂР°РµС‚ СЃР°Р№С‚ РёР· porhai-new/ (С‚Р°Рј Р»РµР¶РёС‚ СЂР°Р±РѕС‡Р°СЏ РІС‘СЂСЃС‚РєР°, СЃРј. CLAUDE.md)
# Рё РїСѓР±Р»РёРєСѓРµС‚ РЅР° GitHub Pages. porhai-eds/ (СЌС‚Р°Р»РѕРЅ СЃ РўРёР»СЊРґС‹), spec/,
# content/ Рё *.py-СЃРєСЂРёРїС‚С‹ РЅРµ РїСѓР±Р»РёРєСѓСЋС‚СЃСЏ вЂ” СЌС‚Рѕ С‚РѕР»СЊРєРѕ РґР»СЏ СЂР°Р·СЂР°Р±РѕС‚РєРё.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site
        run: |
          mkdir -p _site
          cp porhai-new/*.html _site/
          cp porhai-new/sitemap.xml porhai-new/robots.txt _site/
          cp -r porhai-new/assets _site/assets
          cp -r porhai-new/feed _site/feed
          cp CNAME _site/CNAME

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
